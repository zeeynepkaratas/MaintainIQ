name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore core test graph
        run: dotnet restore tests/MaintainIQ.Tests/MaintainIQ.Tests.csproj

      - name: Build core test graph
        run: dotnet build tests/MaintainIQ.Tests/MaintainIQ.Tests.csproj --no-restore --configuration Release --warnaserror

      - name: Test with core coverage
        run: >-
          dotnet test tests/MaintainIQ.Tests/MaintainIQ.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --filter "Category!=SqlServerIntegration"
          --results-directory TestResults

      - name: Enforce layer coverage thresholds
        shell: pwsh
        run: |
          $report = Get-ChildItem TestResults -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if (-not $report) { throw "Coverage report was not produced." }
          [xml]$coverage = Get-Content $report.FullName -Raw
          $thresholds = @{
            'MaintainIQ.Domain' = 0.85
            'MaintainIQ.Services' = 0.70
          }
          foreach ($layer in $thresholds.Keys) {
            $package = $coverage.coverage.packages.package | Where-Object { $_.name -eq $layer }
            if (-not $package) { throw "$layer coverage was not produced." }
            $lineRate = [double]$package.'line-rate'
            Write-Host ("{0} line coverage: {1:P2}" -f $layer, $lineRate)
            if ($lineRate -lt $thresholds[$layer]) {
              throw "$layer line coverage is below $($thresholds[$layer] * 100)%."
            }
          }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
